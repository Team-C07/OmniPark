name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valore fittizio: la build richiede la variabile ma non si collega al database.
      # Le stringhe di connessione reali non vanno mai nel repository.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/omnipark_ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installazione
        run: npm ci

      - name: Analisi statica
        run: npm run lint

      - name: Controllo della formattazione
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
