services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnipark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: omnipark
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipark -d omnipark"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
